[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aptil-backend"
version = "0.1.0"
description = "Aptil API and workers"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # Data (MongoDB via Beanie 2.x, which uses PyMongo's native async client)
    "beanie>=2.0",
    "pymongo>=4.13",
    "certifi>=2024.8",   # CA bundle for Atlas TLS from any host
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    # Auth & security
    "pyjwt>=2.10",
    "passlib[argon2]>=1.7",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "cryptography>=43.0",
    # Infra clients
    "redis>=5.2",
    "celery>=5.4",
    "boto3>=1.35",            # MinIO / S3
    "httpx>=0.27",
    "tenacity>=9.0",
    # AI
    "litellm>=1.52",
    # File parsing
    "pypdf>=5.1",
    "python-docx>=1.1",
    "defusedxml>=0.7",       # safe XML parsing for RSS job feeds
    # Observability
    "structlog>=24.4",
    # Payments
    "stripe>=11.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-boto3",
]
automation = [
    "playwright>=1.48",       # apply engine (installed separately in worker image)
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = [
    "S101",  # assert: used for type narrowing, not for validation
    "S104",  # binding 0.0.0.0 inside a container is intentional
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are evaluated once at import time by
# design, so B008 ("call in default argument") does not apply to them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hard-coded test credentials are the point

[tool.pytest.ini_options]
asyncio_mode = "auto"
# PyMongo's async client binds to the loop it was created on, so every test must
# share one loop rather than getting a fresh per-test loop.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
# Make `app` importable without an editable install, so `pytest` works straight
# from a checkout.
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]
